[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operational-incident-intelligence"
version = "0.1.0"
description = "Synthetic incident response analytics and SLA contracts"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
